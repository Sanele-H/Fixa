[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixa-lang"
version = "0.1.0"
description = "Language and safety for Fixa (P3)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
google = ["google-cloud-translate>=3"]

[tool.setuptools.packages.find]
include = ["lang*"]
