<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fixa{% endblock %}</title>
{#- Plain HTML with inline CSS and no JavaScript, so the page opens in any browser,
    including Opera Mini, and costs only a few KB of data. -#}
<style>
  body { margin: 0; padding: 16px; background: #fcfcfb; color: #0b0b0b;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 28px 0 8px; }
  p { margin: 0 0 10px; }
  .note { color: #52514e; font-size: 14px; }
  .status { padding: 12px 14px; border-radius: 6px; margin: 16px 0; font-weight: 600; }
  .status-genuine { background: #e3f4e3; color: #006300; }
  .status-changed { background: #fbe4e4; color: #9b1c1c; }
  .status-unknown { background: #f0efec; color: #52514e; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid #e1e0d9;
           vertical-align: top; }
  th { color: #52514e; font-weight: 600; }
  blockquote { margin: 0 0 4px; font-style: italic; }
  .fingerprint { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
                 word-break: break-all; color: #52514e; }
  footer { margin-top: 32px; color: #898781; font-size: 13px; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
<footer>Fixa never shows customers' names, phone numbers or addresses: only suburb, date and the work done.</footer>
</main>
</body>
</html>
