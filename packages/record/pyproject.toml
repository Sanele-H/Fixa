[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixa-record"
version = "0.1.0"
description = "Work record and ARPL export for Fixa (P4)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "fpdf2>=2.7",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["record*"]

[tool.setuptools.package-data]
# The PDF font ships with the package, so exports work in a normal (non-editable) install.
record = ["fonts/*.ttf", "fonts/LICENSE_DEJAVU"]
