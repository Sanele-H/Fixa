[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixa"
version = "0.1.0"
description = "Fixa backend: jobs, safety, translation and ranking for the trades marketplace demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
simulation = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["fixa*"]

[tool.setuptools.package-data]
"fixa.translation" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
